<!-- slide -->
# 💻 Projeto: Montagem de PC

### Equipe [Número] - Plataforma [Intel/AMD]

- Aluno 2
- Aluno 3
- Aluno 4

---
<!-- slide -->
## 🎯 O Desafio

- **Cliente / Perfil:** [Ex: Gamer Custo-Benefício]
- **Necessidades principais:** [Ex: Rodar CS:GO a 144 FPS]
- **Plataforma Exigida:** [Intel ou AMD]
- **Orçamento Disponível:** R$ [Valor, ex: 4.500,00]

---
<!-- slide -->
## 🧠 O "Cérebro" da Máquina

- **Processador (CPU):** [Modelo, ex: Ryzen 5 5600]
- **Placa-mãe:** [Modelo, ex: B550M]
- **Memória RAM:** [Capacidade e Frequência, ex: 2x8GB 3200MHz]

> **Justificativa:** Escolhemos esta combinação porque... (explicar para o cliente o ganho de performance e custo).

---
<!-- slide -->
## 💾 Armazenamento e Potência

- **Placa de Vídeo (GPU):** [Modelo, ex: RX 6600 8GB]
- **Armazenamento:** [Tipo e Capacidade, ex: SSD NVMe 1TB]
- **Fonte de Alimentação:** [Potência e Selo, ex: 600W 80 Plus Bronze]

> **Por que essas peças?** A fonte tem folga para upgrades futuros e o NVMe garante carregamentos ultrarrápidos para o perfil.

---
<!-- slide -->
## 🖥️ Gabinete e Periféricos

- **Gabinete:** [Modelo e refrigeração, ex: Mid Tower com 4 fans]
- **Monitor:** [Tamanho e Hz, ex: 24" IPS 144Hz]
- **Teclado e Mouse:** [Modelos, ex: Kit Redragon Mecânico]

> **Importante:** O monitor acompanha o desempenho da placa de vídeo, garantindo a visualização dos 144 frames por segundo.

---
<!-- slide -->

Encontramos um **Notebook com especificações similares**:
- **Modelo:** [Ex: Acer Nitro 5 / Ryzen 5 / GTX 1650]
- **Valor Atual:** [Ex: R$ 4.700,00]

- **Prós do Notebook:** Mobilidade, bateria.
- **Prós do Desktop:** Mais potente pelo preço, refrigeração superior, upgrades fáceis.

---
<!-- slide -->
## ✅ Conclusão / Veredito

Recomendamos ao cliente que compre o **[Desktop ou Notebook]** porque:
1. O custo-benefício é melhor para a sua necessidade.
2. A refrigeração da máquina garante vida útil mais longa.
3. [Argumento final matador para convencer o cliente]

          </textarea>
        </section>
      </div>
    </div>

    <script src="./dist/reveal.js"></script>

    <script src="./mermaid/dist/mermaid.min.js"></script>

    <script src="./plugin/markdown/markdown.js"></script>
    <script src="./plugin/highlight/highlight.js"></script>
    <script src="./plugin/zoom/zoom.js"></script>
    <script src="./plugin/notes/notes.js"></script>
    <script src="./plugin/math/math.js"></script>
    <script>
      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

      // default options to init reveal.js
      var defaultOptions = {
        controls: true,
        progress: true,
        history: true,
        center: true,
        transition: 'default', // none/fade/slide/convex/concave/zoom
        slideNumber: true,
        highlight: {
          highlightOnLoad: false
        },
        plugins: [
          RevealMarkdown,
          RevealHighlight,
          RevealZoom,
          RevealNotes,
          RevealMath
        ]
      };

      // options from URL query string
      var queryOptions = Reveal().getQueryHash() || {};

      var options = extend(defaultOptions, {"_":["modelo-apresentacao-equipes.md"],"static":"static_html"}, queryOptions);
    </script>


    <script>
      Reveal.initialize(options);
      Reveal.addEventListener('ready', function (event) {
        const blocks = Reveal.getRevealElement().querySelectorAll('pre code:not(.mermaid)');
        const hlp = Reveal.getPlugin('highlight');
        blocks.forEach(hlp.highlightBlock);
      });
    </script>

    <script>
      const mermaidOptions = extend({ startOnLoad: false }, {});
      mermaid.startOnLoad = false;
      mermaid.initialize(mermaidOptions);
      const cb = function (event) {
        mermaid.init(mermaidOptions, '.stack.present > .present pre code.mermaid');
        mermaid.init(mermaidOptions, '.slides > .present:not(.stack) pre code.mermaid');
      }
      Reveal.addEventListener('ready', cb);
      Reveal.addEventListener('slidetransitionend', cb);
    </script>
  </body>
</html>
